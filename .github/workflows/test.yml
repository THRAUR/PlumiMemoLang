name: Tests

# The app is meant to run on the computer of whoever clones it, so every change is
# tested on Linux, macOS and Windows.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The PDF tests skip themselves when poppler is missing; install it so they run.
      - name: Install poppler
        shell: bash
        continue-on-error: true
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -y -q poppler-utils ;;
            macOS) brew install poppler ;;
            Windows) choco install poppler -y --no-progress ;;
          esac

      - run: npm ci
      - run: npm test
